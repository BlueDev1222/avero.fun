<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080d17" />
  <title>Avero PNG</title>
  <meta name="description" content="Avero Rules Banner PNG." />
  <meta property="og:title" content="Avero Rules Banner" />
  <meta property="og:description" content="Official Avero Rules Banner." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://avero.fun/png/" />
  <meta property="og:image" content="https://avero.fun/Avero%20Rules%20Banner.png" />
  <link rel="canonical" href="https://avero.fun/png/" />
  <link rel="icon" href="../Avero%20Logo.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #080d17;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 15%, rgba(64, 126, 255, .13), transparent 38%),
        #080d17;
    }
    main {
      width: min(1200px, 100%);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #7da2ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: -.04em;
    }
    .image-wrap {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: rgba(255,255,255,.025);
      box-shadow: 0 28px 80px rgba(0,0,0,.38);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    a {
      color: #fff;
      text-decoration: none;
    }
    .button {
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      transition: .18s ease;
    }
    .button:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-1px);
    }
    .primary {
      background: #2f6df6;
      border-color: #2f6df6;
    }
    .primary:hover { background: #3b78ff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Avero Media</p>
    <h1>Avero Rules Banner</h1>

    <div class="image-wrap">
      <img
        src="../Avero%20Rules%20Banner.png"
        alt="Avero Rules Banner"
      />
    </div>

    <div class="actions">
      <a class="button primary" href="../Avero%20Rules%20Banner.png" download>Download PNG</a>
      <a class="button" href="/">Back to Avero</a>
    </div>
  </main>
</body>
</html>
